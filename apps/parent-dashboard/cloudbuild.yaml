substitutions:
  _REGION: us-central1
  _GCS_BUCKET: focusquest-parent-dashboard
  _CDN_URL_MAP: focusquest-dashboard-cdn

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        bash ci/check-npm-packages-in-commit.sh
        bash ci/check-sensitive-files.sh

  - name: node:20
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        cd apps/parent-dashboard
        npm ci
        npm test
        npm audit --audit-level=critical
        npm run build

  - name: aquasec/trivy:latest
    entrypoint: bash
    args:
      - -c
      - |
        trivy fs --exit-code 0 --severity CRITICAL,HIGH apps/parent-dashboard \
          || echo "Trivy filesystem scan completed; configure fail-on-critical in production"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gsutil -m rsync -r -d apps/parent-dashboard/dist gs://${_GCS_BUCKET}/staging
        gcloud compute url-maps invalidate-cdn-cache ${_CDN_URL_MAP} --path "/*"

artifacts:
  objects:
    location: gs://${_GCS_BUCKET}/staging/
    paths:
      - apps/parent-dashboard/dist/**
