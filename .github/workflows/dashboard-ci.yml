name: Dashboard CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/parent-dashboard/**"
      - "ci/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    paths:
      - "apps/parent-dashboard/**"
      - "ci/**"
      - ".github/workflows/dashboard-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/parent-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/parent-dashboard
        run: npm ci

      - name: Run tests
        working-directory: apps/parent-dashboard
        run: npm test

      - name: npm audit (critical)
        working-directory: apps/parent-dashboard
        run: npm audit --audit-level=critical

      - name: Build production bundle
        working-directory: apps/parent-dashboard
        run: npm run build

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: apps/parent-dashboard
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
