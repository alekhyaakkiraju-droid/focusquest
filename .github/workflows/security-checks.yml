name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - wo/**

jobs:
  policy-and-vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block committed npm package artifacts
        run: bash ci/check-npm-packages-in-commit.sh

      - name: Block sensitive files in git
        run: bash ci/check-sensitive-files.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/parent-dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: apps/parent-dashboard
        run: npm ci

      - name: npm audit (critical)
        working-directory: apps/parent-dashboard
        run: npm audit --audit-level=critical

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
